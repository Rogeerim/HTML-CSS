<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    div.container {
        display: grid;
        width: 750px;
        height: 550px;
        grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr 1fr;
        grid-auto-flow: row;
        grid-auto-rows: 1fr;
        grid-auto-columns: 1fr;
    }

    div.item {
        display: flex;
        place-items: center;
        place-content: center;
    }

    div#box1 {
        background-color: rgba(127, 255, 212, 0.514);
        /* Span (Expansão) */
        grid-area: 1 / 1 / 2 / 5
    }

    div#box2 {
        background-color: rgba(127, 178, 255, 0.514);
        grid-area: 2 / 1 / 4 / 3
    }

    div#box3 {
        background-color: rgba(148, 255, 127, 0.514);
        grid-area: 2 / 3 / 4 / 5    
    }
    
</style>
<body>
    <div class="container">
        <div id="box1" class="item">A</div>
        <div id="box2" class="item">B</div>
        <div id="box3" class="item">C</div>
        <div style="display: none;" id="box4" class="item">C</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Flexbox</title>
    <style>
        div.container {
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;
            background-color: lightskyblue;
        }

        div.item {
            padding: 20px;
            border: 1px solid black
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="align-self: flex-end;" class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Justify-Content Align-Items</title>
    <style>
        body {
            background-color: darkblue;
        }

        div.container {
            display: flex;
            flex-flow: row nowrap;
            
            height: 300px;
            justify-content: space-evenly;
            align-items: center;
            background-color: rgb(67, 35, 109);
        }

        div.item {
            margin-left: 5px;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
    </div>
</body>
</html>

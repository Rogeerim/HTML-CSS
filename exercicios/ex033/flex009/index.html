<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Flexbox</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        div.container {
            display: flex;
            width: 100%;
            height: 150px;
            justify-content: space-evenly;
            flex-flow: row nowrap;
            border: 1px solid black;
            background-color: lightskyblue;
        }

        div.container2 {
            display: flex;
            width: 100%;
            height: 150px;
            justify-content: space-evenly;
            flex-flow: row nowrap;
            border: 1px solid black;
            background-color: rgb(163, 180, 88);
        }

        div.container3 {
            display: flex;
            width: 100%;
            height: 150px;
            justify-content: space-evenly;
            flex-flow: row nowrap;
            border: 1px solid black;
            background-color: rgb(180, 88, 131);
        }

        div.container1#item1 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }

        div.container1#item2 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }
        
        div.container1#item3 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }        

        div.container2#item1 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }

        div.container2#item2 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 2;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }
        
        div.container2#item3 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 1;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }     

        div.container3#item1 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 1; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }

        div.container3#item2 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 0; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }
        
        div.container3#item3 {
            flex-basis: 300px;
            /* 0 = Desliga o Encolhimento 1 = Liga o Encolhimento (Junto com o container pai) */
            flex-shrink: 2; 
            /* 0 = Desliga o Crescimento 1 = Liga o Crescimento (Junto com o container pai) */            
            flex-grow: 0;
            margin: 1px;
            text-align: center;
            border:1px solid black
        }     

    </style>
</head>
<body>
    <div class="container">
        <div id="item1" class="container1">A</div>
        <div id="item2" class="container1">B</div>
        <div id="item3" class="container1">C</div>
    </div>
    <div class="container2">
        <div id="item1" class="container2">A</div>
        <div id="item2" class="container2">B</div>
        <div id="item3" class="container2">C</div>
    </div>
    <div class="container3">
        <div id="item1" class="container3">A</div>
        <div id="item2" class="container3">B</div>
        <div id="item3" class="container3">C</div>
    </div>
</body>
</html>

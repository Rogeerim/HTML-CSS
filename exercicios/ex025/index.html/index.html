<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            height: 300px;
            width: 300px;
            background-color: lightgoldenrodyellow;
            border-width: 10px;
            border-style: solid;
            border-color: darkgray;

            padding: 10px 10px 10px 10px;
        }

        a {
            border-width: 2px;
            border-style: dashed;
            border-color: red;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem sao exemplos de box- level mas os <a href="#">Links sao exemplos de caixas inline-level</a></p>
</body>
</html>

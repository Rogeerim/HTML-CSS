<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap');
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            color: black;
        }

        h1 {
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 4em;
            font-weight: normal;
        }

        h2 {
            font-family: 'Kaushan Script', cursive;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <h1>Feito a mao</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eos minus excepturi tempore voluptates eaque nisi pariatur ut, officia voluptas assumenda amet. A officiis illo quaerat ullam doloremque provident odit non.</p>
    <h2>Subtitulo</h2>
    
</body>
</html>

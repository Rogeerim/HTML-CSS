<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 500px;
            border-radius: 20px 20px 20px 20px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>Acessando o site do 
        
        <iframe src="https://easypanel.geoclick.sbs" frameborder="1" scrolling="no">
            <a href="https://easypanel.com" target="_blank"></a>
        </iframe>
        
        para aprender a programar.</p>

        <p>
            O repositorio do Rogerim

            <iframe src="https://rogeerim.github.io/HTML-CSS
            " frameborder="0">
                <p>o Github nao permite indexação por iframe.</p>
            </iframe>
        </p>
</body>
</html>

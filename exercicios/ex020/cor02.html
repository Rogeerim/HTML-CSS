<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        * {
            height: 100%;
        }
        body {
            background-attachment: fixed;
            background-image: linear-gradient(to top, #7B4BBF, #BF369B, #F25252, #F2845C, #F2B56B);
        }
    </style>
</head>
<body>
    <h1 style="color: #E0DAC8;">Testando gradientes</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="topBar">
            <h1>Login</h1>
        </div>

        <div id="loginUsuario">
            <form action="" method="post" autocomplete="on">
                <label for="iEmail" class="loginLabel">
                    <p>E-mail</p>
                    <input type="email" name="email" id="iEmail" placeholder="Ex. johnburguer123@gmail.com">
                </label>

                <label for="iSenha" class="loginLabel">
                    <p>Senha</p>
                    <input type="password" name="senha" id="iSenha" placeholder="Sua Senha">
                </label>

                <label for="submit">
                    <p></p>
                    <input type="submit" value="Sign Up" id="submit">
                </label>
            </form>

            <div id="botoesSociais">
                <a href="#" class="botaoSocial"><img src="https://t4.ftcdn.net/jpg/03/98/85/79/360_F_398857947_98HA0SRd9gWtUcJBjtskrk1vGEWWamQa.jpg" alt="Facebook Logo"></a>
                <a href="#" class="botaoSocial"><img src="https://images.seeklogo.com/logo-png/62/1/google-new-logo-png_seeklogo-622426.png" alt="Google Logo"></a>                
            </div>

            <a href="#" id="forgotpassword">Esqueceu a sua senha?</a>
        </div>

        <div id="bottomBar">

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="topBar">
            <h1>Login</h1>
        </div>

        <div id="loginUsuario">
            <form action="" method="post" autocomplete="on">
                <label for="iUsuario" class="loginLabel">
                    <p>Usuário</p>
                    <input type="text" name="usuario" id="iUsuario" placeholder="Ex. johnburguer123">
                </label>

                <label for="iSenha" class="loginLabel">
                    <p>Senha</p>
                    <input type="password" name="senha" id="iSenha" placeholder="Sua Senha">
                </label>
            </form>
        </div>

        <div id="bottomBar">

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Automatizando</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="telaLogin">
            <div id="imagemUsuario">
            </div>
            <div id="textFields">
            <form action="" method="post" autocomplete="on">
                <label for="iEmail">
                    <img src="https://cdn-icons-png.flaticon.com/512/115/115681.png" alt="">
                    <input type="email" name="Email" id="iEmail">
                </label>
                <label for="iSenha">
                    <input type="password" name="Senha" id="iSenha">
                </label>
            </form>
            </div>
        </div>
    </div>
</body>
</html>

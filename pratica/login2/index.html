<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Automatizando</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section id="telaLogin">
            <div id="imagemUsuario">
            </div>
            <div id="textFields">
                <form action="" method="post" autocomplete="on">
                    <label for="iEmail">
                        <div id="emailField" class="customField">
                            <div class="iconBox">
                                <img src="https://cdn-icons-png.flaticon.com/512/115/115681.png" alt="">
                            </div>
                            <input type="email" name="Email" id="iEmail" placeholder="Seu E-mail">
                        </div>
                    </label>
                            
                    <label for="iSenha">
                        <div id="emailField" class="customField">
                            <div class="iconBox">
                                <img src="https://cdn-icons-png.flaticon.com/512/115/115681.png" alt="">
                            </div>                              
                            <input type="password" name="Senha" id="iSenha" placeholder="Sua Senha">
                        </div>
                    </label>

                    <input type="submit" value="LOGIN">
                </form>
            </div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            width: 100vw;
            height: 100%;
            background-color: black;
        }

        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        img#tela {
            display: block;
            width: 100%;
            height: auto;
        }

        a {
            display: block;
            background-color: rgb(14, 12, 12);
            color: white;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        a span {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        a:hover span {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <img src="..//images/tela-youtube.png" alt="Tela do Youtube" id="tela">
    <a href="https://www.youtube.com" target="_blank"><span>ACESSE</span></a>
</body>
</html>
